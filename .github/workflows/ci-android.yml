name: Android CI

on:
  push:
    branches: ['*']
    paths: ['android/**', 'root-module-manual/**', '.github/workflows/ci-android.yml']
  pull_request:
    paths: ['android/**', 'root-module-manual/**']
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a signed community release (requires signing secrets)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.signing.outputs.signed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37.0' 'ndk;30.0.14904198' 'cmake;3.22.1'
      - name: Configure optional release signing
        id: signing
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_FILE }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > android/release.keystore
            printf 'RELEASE_STORE_FILE=../release.keystore\nRELEASE_STORE_PASSWORD=%s\nRELEASE_KEY_ALIAS=%s\nRELEASE_KEY_PASSWORD=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/local.properties
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'No release signing secrets: build test/debug APK only.'
          fi
      - name: Unit tests
        run: ./gradlew testFossDebugUnitTest
        working-directory: android
      - name: Build signed APKs and root-module ZIPs
        if: steps.signing.outputs.signed == 'true'
        run: ./gradlew packageReleaseArtifacts
        working-directory: android
      - name: Build debug APK without release secrets
        if: steps.signing.outputs.signed != 'true'
        run: ./gradlew assembleFossDebug
        working-directory: android
      - name: Read version
        id: version
        run: echo "version=$(sed -n 's/val appVersionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: librepods-android-${{ steps.version.outputs.version }}
          path: |
            release/*
            android/app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: android/app/build/reports/tests/testFossDebugUnitTest
      - name: Require signing for publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release && steps.signing.outputs.signed != 'true'
        run: echo 'Configure all four RELEASE_* signing secrets before publishing.' >&2; exit 1
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && needs.build.outputs.signed == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: librepods-android-${{ needs.build.outputs.version }}
          path: artifacts
      - name: Publish community release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" artifacts/release/* --title "LibrePods $VERSION (community build)" --notes-file docs/release-notes-rc1.md
